// Fabric-loom based build.gradle (improved)
plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'

    // Fabric loom plugin
    id 'fabric-loom' version '1.5.6'

    id 'com.gradleup.shadow' version '9.4.1'
    id 'maven-publish'
    id "org.openrewrite.rewrite" version "7.35.0"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

version = mod_version
group = mod_group_id

base {
    archivesName = 'touhoulittlemaid'
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://maven.terraformersmc.com/' }
    maven { url = 'https://maven.shedaniel.me/' }
    maven { url = 'https://api.modrinth.com/maven' }
    maven { url = 'https://jitpack.io' }
}

// Loom configuration
loom {
    // Use properties from gradle.properties where possible
    // mappings and loader versions may need adjustments based on Minecraft version
}

dependencies {
    // Minecraft and mappings
    minecraft "com.mojang:minecraft:${minecraft_version}"
    // yarn mappings placeholder — the exact mapping version may need update to a valid yarn build
    mappings "net.fabricmc:yarn:1.0+build.1"

    // Fabric loader and api — versions are placeholders and may need updating
    modImplementation "net.fabricmc:fabric-loader:0.14.19"
    modImplementation "net.fabricmc.fabric-api:fabric-api:1.76.0+1.26.1"

    // Keep libraries previously shaded
    implementation 'com.squareup:javapoet:1.13.0'

    // Libraries from original project to be kept/relocated as needed
    mcLib "org.gagravarr:vorbis-java-core:0.8"
    mcLib "io.github.jaredmdobson:concentus:1.0.2"
    mcLib "com.googlecode.soundlibs:mp3spi:1.9.5.4"
    mcLib "org.yaml:snakeyaml:2.4"

    testImplementation 'junit:junit:4.13.2'

    // NOTE: Third-party mod deps (JEI, Cloth-config, Jade, Curios, GeckoLib, Sodium/Iris, Aquaculture)
    // need to be replaced with Fabric-compatible artifacts. These are TODOs.
}

tasks.compileJava {
    options.encoding = 'UTF-8'
}

shadowJar {
    dependencies {
        exclude(dependency('junit:junit'))
    }
    relocate 'io.github.jaredmdobson.concentus', 'com.github.tartaricacid.touhoulittlemaid.libs.concentus'
    relocate 'org.gagravarr', 'com.github.tartaricacid.touhoulittlemaid.libs.gagravarr'
    relocate 'javazoom.jl', 'com.github.tartaricacid.touhoulittlemaid.libs.javazoom.jl'
    relocate 'javazoom.spi', 'com.github.tartaricacid.touhoulittlemaid.libs.javazoom.spi'
    relocate 'org.tritonus', 'com.github.tartaricacid.touhoulittlemaid.libs.org.tritonus'
    relocate 'org.yaml.snakeyaml', 'com.github.tartaricacid.touhoulittlemaid.libs.snakeyaml'
    mergeServiceFiles()
    minimize()
}

assemble {
    dependsOn shadowJar
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact(shadowJar.archiveFile) {
                classifier = null
                builtBy shadowJar
            }
        }
    }
    repositories {
        mavenLocal()
    }
}

rewrite {
    activeRecipe("com.github.tartaricacid.Upgrade")
}
