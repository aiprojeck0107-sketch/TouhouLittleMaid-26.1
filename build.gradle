// Fabric-loom based build.gradle (improved)
plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'

    // Fabric loom plugin
    id 'fabric-loom' version '1.5.6'

    // Use the widely-used Shadow plugin maintained by John Rengelman (better Gradle compatibility)
    id 'com.github.johnrengelman.shadow' version '8.1.1'

    id 'maven-publish'
    id "org.openrewrite.rewrite" version "7.35.0"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

version = mod_version
group = mod_group_id

base {
    archivesName = 'touhoulittlemaid'
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://maven.terraformersmc.com/' }
    maven { url = 'https://maven.shedaniel.me/' }
    maven { url = 'https://api.modrinth.com/maven' }
    maven { url = 'https://jitpack.io' }
}

configurations {
    shaded
}

dependencies {
    // Minecraft and mappings (use properties from gradle.properties)
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings "net.fabricmc:yarn:${yarn_mappings}"

    // Fabric loader and api using properties
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    // Keep libraries previously shaded (put into shaded or implementation)
    implementation 'com.squareup:javapoet:1.13.0'
    implementation 'org.gagravarr:vorbis-java-core:0.8'
    implementation 'io.github.jaredmdobson:concentus:1.0.2'
    implementation 'com.googlecode.soundlibs:mp3spi:1.9.5.4'
    implementation 'org.yaml:snakeyaml:2.4'

    testImplementation 'junit:junit:4.13.2'
}

// Loom configuration (small defaults, can be extended)
loom {
    accessWidenerPath = file("src/main/resources/${mod_id}.accesswidener")
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// ShadowJar configuration: configure existing shadowJar task if it exists, otherwise register it.
import com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar

// closure to configure a ShadowJar task
def configureShadow = { ShadowJar s ->
    s.archiveClassifier.set('')
    s.configurations = [project.configurations.runtimeClasspath]
    s.relocate('io.github.jaredmdobson.concentus', 'com.github.tartaricacid.touhoulittlemaid.libs.concentus')
    s.relocate('org.gagravarr', 'com.github.tartaricacid.touhoulittlemaid.libs.gagravarr')
    s.relocate('javazoom.jl', 'com.github.tartaricacid.touhoulittlemaid.libs.javazoom.jl')
    s.relocate('javazoom.spi', 'com.github.tartaricacid.touhoulittlemaid.libs.javazoom.spi')
    s.relocate('org.tritonus', 'com.github.tartaricacid.touhoulittlemaid.libs.org.tritonus')
    s.relocate('org.yaml.snakeyaml', 'com.github.tartaricacid.touhoulittlemaid.libs.snakeyaml')
    s.mergeServiceFiles()
    s.minimize()
}

if (tasks.findByName('shadowJar')) {
    tasks.named('shadowJar', ShadowJar).configure(configureShadow)
} else {
    tasks.register('shadowJar', ShadowJar, configureShadow)
}

// Make assemble depend on shadowJar if it exists (use provider to avoid eager resolution)
if (tasks.findByName('shadowJar')) {
    tasks.named('assemble').configure { dependsOn tasks.named('shadowJar') }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact(tasks.named('shadowJar').flatMap { it.archiveFile }) {
                classifier = null
                builtBy tasks.named('shadowJar')
            }
        }
    }
    repositories {
        mavenLocal()
    }
}

rewrite {
    activeRecipe("com.github.tartaricacid.Upgrade")
}
