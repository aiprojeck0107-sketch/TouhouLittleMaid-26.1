// Minimal fabric-loom based build.gradle template
plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'

    // Fabric loom plugin (starter template). Version may need update to a recent stable one.
    id 'fabric-loom' version '1.5.6'

    id 'com.gradleup.shadow' version '9.4.1'
    id 'maven-publish'
    id "org.openrewrite.rewrite" version "7.35.0"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

version = mod_version
group = mod_group_id

base {
    archivesName = 'touhoulittlemaid'
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://maven.terraformersmc.com/' }
    maven { url = 'https://maven.shedaniel.me/' }
    maven { url = 'https://api.modrinth.com/maven' }
    maven { url = 'https://jitpack.io' }
}

loom {
    // loom settings can be tuned later
}

dependencies {
    // Fabric loader and fabric api
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings "net.fabricmc:yarn:1.0+build"
    modImplementation "net.fabricmc:fabric-loader:0.14.0"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.88.0+1.26.0"

    // Keep libraries previously shaded
    implementation 'com.squareup:javapoet:1.13.0'

    // example compat dependencies — WILL need replacement with Fabric equivalents
    // JEI / Cloth Config / Jade / Curios / GeckoLib / Sodium/Iris / Aquaculture
    // TODO: replace neoforge artifacts with Fabric variants
}

tasks.compileJava {
    options.encoding = 'UTF-8'
}

shadowJar {
    // keep relocations from original build (may need update)
    dependencies {
        exclude(dependency('junit:junit'))
    }
    relocate 'io.github.jaredmdobson.concentus', 'com.github.tartaricacid.touhoulittlemaid.libs.concentus'
    relocate 'org.gagravarr', 'com.github.tartaricacid.touhoulittlemaid.libs.gagravarr'
    relocate 'javazoom.jl', 'com.github.tartaricacid.touhoulittlemaid.libs.javazoom.jl'
    relocate 'javazoom.spi', 'com.github.tartaricacid.touhoulittlemaid.libs.javazoom.spi'
    relocate 'org.tritonus', 'com.github.tartaricacid.touhoulittlemaid.libs.org.tritonus'
    relocate 'org.yaml.snakeyaml', 'com.github.tartaricacid.touhoulittlemaid.libs.snakeyaml'
    mergeServiceFiles()
    minimize()
}

assemble {
    dependsOn shadowJar
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact(shadowJar.archiveFile) {
                classifier = null
                builtBy shadowJar
            }
        }
    }
    repositories {
        mavenLocal()
    }
}

rewrite {
    activeRecipe("com.github.tartaricacid.Upgrade")
}
