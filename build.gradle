// Fabric-loom based build.gradle (improved)
plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'

    // Fabric loom plugin
    id 'fabric-loom' version '1.5.6'

    id 'com.gradleup.shadow' version '9.4.1'
    id 'maven-publish'
    id "org.openrewrite.rewrite" version "7.35.0"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

version = mod_version
group = mod_group_id

base {
    archivesName = 'touhoulittlemaid'
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://maven.terraformersmc.com/' }
    maven { url = 'https://maven.shedaniel.me/' }
    maven { url = 'https://api.modrinth.com/maven' }
    maven { url = 'https://jitpack.io' }
}

configurations {
    // optional configuration if you want to separate libraries that will be shaded
    shaded
}

dependencies {
    // Minecraft and mappings (use properties from gradle.properties)
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings "net.fabricmc:yarn:${yarn_mappings}"

    // Fabric loader and api using properties
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    // Keep libraries previously shaded (put into shaded or implementation)
    implementation 'com.squareup:javapoet:1.13.0'
    implementation 'org.gagravarr:vorbis-java-core:0.8'
    implementation 'io.github.jaredmdobson:concentus:1.0.2'
    implementation 'com.googlecode.soundlibs:mp3spi:1.9.5.4'
    implementation 'org.yaml:snakeyaml:2.4'

    testImplementation 'junit:junit:4.13.2'
}

// Loom configuration (small defaults, can be extended)
loom {
    // If you use an access widener, point here (gradle will include it)
    accessWidenerPath = file("src/main/resources/${mod_id}.accesswidener")
    // You can tune runs/data generation here later
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // Keep target compatibility in sync with toolchain if necessary
}

// ShadowJar config
shadowJar {
    archiveClassifier.set('')
    dependencies {
        exclude(dependency('junit:junit'))
    }
    relocate 'io.github.jaredmdobson.concentus', 'com.github.tartaricacid.touhoulittlemaid.libs.concentus'
    relocate 'org.gagravarr', 'com.github.tartaricacid.touhoulittlemaid.libs.gagravarr'
    relocate 'javazoom.jl', 'com.github.tartaricacid.touhoulittlemaid.libs.javazoom.jl'
    relocate 'javazoom.spi', 'com.github.tartaricacid.touhoulittlemaid.libs.javazoom.spi'
    relocate 'org.tritonus', 'com.github.tartaricacid.touhoulittlemaid.libs.org.tritonus'
    relocate 'org.yaml.snakeyaml', 'com.github.tartaricacid.touhoulittlemaid.libs.snakeyaml'
    mergeServiceFiles()
    minimize()
}

tasks.named('assemble') {
    dependsOn shadowJar
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact(shadowJar.archiveFile) {
                classifier = null
                builtBy shadowJar
            }
        }
    }
    repositories {
        mavenLocal()
    }
}

rewrite {
    activeRecipe("com.github.tartaricacid.Upgrade")
}
